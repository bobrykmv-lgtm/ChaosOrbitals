name: Build ChaosOrbitals

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build JAR with Gradle (retry on 429)
        run: |
          if [ -f "./gradlew" ]; then
            CMD="./gradlew jar --no-daemon"
          else
            CMD="gradle jar --no-daemon"
          fi

          for attempt in 1 2 3 4; do
            echo "Build attempt $attempt..."
            if $CMD; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChaosOrbitals-jar
          path: build/libs/*.jar
